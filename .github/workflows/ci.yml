name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify all src modules import cleanly
        run: |
          python -c "
          from src import ingest, classify, retrieve, route, generate, guardrails, logging_store, llm, pipeline, telemetry, api
          print('✓ All src modules import successfully')
          "

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Verify harness CLI contract
        run: |
          python evaluation/harness.py \
            --input data/validation_tickets.json \
            --output /tmp/ci_test_run.json
          echo "✓ Harness ran successfully"

      - name: Verify harness output is valid JSON
        run: |
          python -c "
          import json
          with open('/tmp/ci_test_run.json') as f:
              output = json.load(f)
          assert 'metrics' in output, 'Missing metrics key'
          assert 'results' in output, 'Missing results key'
          print(f'✓ Output valid JSON with {len(output[\"results\"])} results')
          "
